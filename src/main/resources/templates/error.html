<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TCoaching | Fout</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
    <div class="auth-eyebrow">TCoaching</div>
    <h1>Er liep iets mis.</h1>
    <p class="auth-body" th:if="${status == 401}">Aanmelden is nodig om deze pagina te openen. Ga naar <a href="/login">/login</a> en meld je daar aan.</p>
    <p class="auth-body" th:if="${status != 401 and message != null and !#strings.isEmpty(message)}" th:text="${message}">De pagina kon niet correct worden geladen.</p>
    <p class="auth-body" th:if="${status != 401 and (message == null or #strings.isEmpty(message))}">De pagina kon niet correct worden geladen. Probeer opnieuw of ga terug naar de website.</p>
    <p class="auth-meta">
      Statuscode:
      <strong th:text="${status != null ? status : 'onbekend'}">onbekend</strong>
      ·
      <a href="/">Terug naar home</a>
    </p>
    </section>
  </main>
</body>
</html>
